<!doctype html><meta charset="utf-8"><title>金丸ECP 性質テスト</title>
<!-- 使い方：リポジトリのフォルダで python -m http.server を起動し、/tests/property-test.html を開く。黄色の欄に結果が出る -->
<body><pre id="out" style="position:fixed;top:0;left:0;right:0;z-index:99;background:#ff0;font:12px monospace;white-space:pre-wrap;margin:0">running</pre>
<script>
(async () => {
  const L = [], fails = [];
  const ok = (cond, msg) => { if (!cond && fails.length < 40) fails.push(msg); return cond; };
  const report = () => {
    const txt = (fails.length ? "FAIL " + fails.length + "\n" + fails.join("\n") : "ALL PASS") + "\n" + L.join("\n");
    document.getElementById("out").textContent = txt;
    
  };
  try {
    // 本物の保存データを消したり上書きしたりしないよう、テスト中は保存しない
    Storage.prototype.setItem = function(){}; Storage.prototype.removeItem = function(){}; Storage.prototype.clear = function(){};
    // 公開している index.html を読み、ツール本体のスクリプトだけを取り出して動かす
    const src = await fetch("../index.html?" + Date.now()).then(r => r.text());
    const i = src.search(/<script>\s*\(function\(\)\{/);
    const holder = document.createElement("div"); holder.innerHTML = src.slice(src.indexOf("<body>") + 6, i); document.body.appendChild(holder);
    let js = src.slice(i + 8, src.indexOf("<\/script>", i));
    const end = js.lastIndexOf("})();");
    js = js.slice(0, end) + "window.__T={allocate,ladder,isClean,cleanNeighbors,needOdds,stepNeeds,currentBet,apply,render,newState,save,UNIT,STEP_RATIO,ARMY_RATIO,ODDS_DIV,MIN_CAPITAL,get state(){return state},set state(v){state=v},setUndo(v){undoStack=v}};" + js.slice(end);
    const s = document.createElement("script"); s.textContent = js; document.body.appendChild(s);
    const T = window.__T;
    const {UNIT, STEP_RATIO, ARMY_RATIO, ODDS_DIV, MIN_CAPITAL} = T;
    const $ = id => document.getElementById(id);
    const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");

    // 独立した参照実装：比率どおりか（本隊・最後の段に端数がない）
    const refClean = c => {
      const al = T.allocate(c); if (!al) return false;
      const u = al[0] / ARMY_RATIO[0];
      if (!al.every((v, k) => v === u * ARMY_RATIO[k])) return false;
      return al.every(v => { const l = T.ladder(v); const a = l[0] / STEP_RATIO[0]; return l.every((x, k) => x === a * STEP_RATIO[k]); });
    };
    // 旧実装と配分が同じか
    const oldAlloc = c => { const u = Math.floor(c / 7 / 1300) * 1300; return u < 1300 ? null : [u, u * 2, c - u * 3]; };
    const oldLadder = al => { const a = Math.floor(al / 13 / 100) * 100; return [a, a * 3, al - a * 4]; };
    // 必要オッズの参照：t×amount ≧ pay×DIV となる最小の t（DIV 以下なら DIV+1）
    const refT = (pay, amount) => { let t = 1; while (amount * t < pay * ODDS_DIV) t++; return Math.max(t, ODDS_DIV + 1); };

    // ---- 1. 端数が出ない金額 ----
    const caps = [];
    for (let c = 100; c <= 400000; c += 100) caps.push(c);
    let seed = 12345; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
    for (let k = 0; k < 3000; k++) caps.push(Math.floor(rnd() * 20000000) + 100);
    let nClean = 0, nFrac = 0, nRegress = 0;
    for (const raw of caps){
      const c = Math.floor(raw / UNIT) * UNIT;
      const al = T.allocate(c), oa = oldAlloc(c);
      ok(JSON.stringify(al) === JSON.stringify(oa), "allocate differs from old at " + c);
      if (al) al.forEach(v => ok(JSON.stringify(T.ladder(v)) === JSON.stringify(oldLadder(v)), "ladder differs at " + v)), nRegress++;
      const {low, up} = T.cleanNeighbors(c);
      ok(T.isClean(c) === refClean(c), "isClean mismatch " + c);
      refClean(c) ? nClean++ : nFrac++;
      if (c < MIN_CAPITAL) ok(low === null, "low should be hidden below min " + c);
      else ok(low !== null && low <= c, "low <= input " + c + " low=" + low);
      ok(up !== null && c < up, "input < up " + c + " up=" + up);
      if (low !== null) ok(refClean(low), "low not clean " + low);
      ok(refClean(up), "up not clean " + up);
      // 下と上のあいだ（両端を除く）に端数が出ない額がない。入力額より下で low より大きいものもない
      const from = low === null ? UNIT : low + UNIT;
      if (raw < 400100 || caps.indexOf(raw) % 50 === 0){
        for (let x = from; x < up; x += UNIT) if (refClean(x)) { ok(false, "clean amount " + x + " between " + low + " and " + up); break; }
      }
      if (c >= MIN_CAPITAL && low === c) ok(refClean(c), "low==input but not clean " + c);
    }
    L.push("caps tested: " + caps.length + " (clean " + nClean + ", fraction " + nFrac + ")");
    // 手で確かめた例
    for (const [c, lo, hi, fr] of [[10000, 9100, 18200, 900], [25000, 18200, 27300, 6800], [100000, 91000, 100100, 9000]]){
      const r = T.cleanNeighbors(c);
      ok(r.low === lo && r.up === hi && c - r.low === fr, "example " + c + " -> " + JSON.stringify(r));
    }

    // ---- 2. 端数が出ない軍資金では、どの部隊でも段ごとの必要オッズが同じ ----
    let nSame = 0;
    for (let c = MIN_CAPITAL; c <= 5000000; c += MIN_CAPITAL * 7){
      if (!refClean(c)) continue;
      const st = T.newState(c, 110);
      const labels = st.armies.map(a => T.stepNeeds(a).map(n => n && n.label).join("/"));
      ok(labels.every(l => l === labels[0]), "needs differ across armies at " + c + ": " + labels.join(" | "));
      nSame++;
    }
    L.push("clean capitals with same per-step odds: " + nSame + " e.g. " + T.stepNeeds(T.newState(91000, 110).armies[0]).map(n => n.label).join("/"));

    // ---- 3. シミュレーション：的中・不的中・復活・分け直しのあとも正しいか ----
    let nSteps = 0, nRevive = 0, nResplit = 0, nUi = 0;
    for (let run = 0; run < 400; run++){
      const c = Math.max(MIN_CAPITAL, Math.floor(rnd() * 3000000 / UNIT) * UNIT);
      T.state = T.newState(c, 101 + Math.floor(rnd() * 40)); T.setUndo([]);
      for (let k = 0; k < 40; k++){
        const bet = T.currentBet();
        if (!bet || (T.state.armies.reduce((s, a) => s + a.funds, 0) - T.state.capital) >= T.state.target) break;
        const a = T.state.armies[bet.i];
        // 各部隊・各段：投票額×必要オッズ ≧ 必要払戻、かつ最小
        for (const arm of T.state.armies){
          const needs = T.stepNeeds(arm);
          let f = arm.funds;
          needs.forEach((n, s) => {
            if (!n) return;
            const amt = Math.min(arm.ladder[s], Math.floor(f / UNIT) * UNIT);
            const pay = arm.alloc - f + amt;
            ok(n.pay === pay, "stepNeeds pay " + n.pay + " vs " + pay);
            const t = Math.round(n.odds * ODDS_DIV);
            ok(amt * t >= pay * ODDS_DIV, "bet*odds < pay: " + amt + "*" + n.odds + " < " + pay);
            ok(t === refT(pay, amt), "odds not minimal: " + n.odds + " ref " + refT(pay, amt) / ODDS_DIV);
            f -= amt;
          });
        }
        // 次の投票の表示（画面）と今の状態からの計算が一致
        T.render();
        const n = T.needOdds(a.alloc, a.funds, bet.amount);
        const t = refT(a.alloc - a.funds + bet.amount, bet.amount);
        const expect = "必要な合成オッズ：" + (t / ODDS_DIV).toFixed(1) + "倍以上 （払戻 " + yen(a.alloc - a.funds + bet.amount) + "以上）";
        ok($("needOdds").textContent === expect, "UI needOdds '" + $("needOdds").textContent + "' expected '" + expect + "'");
        ok(T.stepNeeds(a)[a.step].label === n.label, "army panel current step differs from next bet");
        nUi++;
        // 結果：外れ／小さい当たり／大きい当たり（復活が起きる）
        const r = rnd();
        const hit = r < 0.45;
        const payout = hit ? Math.floor(bet.amount * (r < 0.15 ? 1 + rnd() * 2 : 3 + rnd() * 40) / 10) * 10 : 0;
        T.apply(bet, hit, payout, {date: "2026-11-06", venue: "24_大村", race: 1});
        const note = T.state.history[T.state.history.length - 1].note;
        if (/復活/.test(note)) nRevive++;
        if (/分け直し/.test(note)) nResplit++;
        nSteps++;
      }
    }
    L.push("simulated races: " + nSteps + " (UI checks " + nUi + ", revive " + nRevive + ", re-split " + nResplit + ")");
    ok(nRevive > 0 && nResplit > 0, "simulation did not cover revive/re-split");

    // ---- 4. 画面：端数の案内 ----
    T.state = T.newState(100000, 110); T.setUndo([]); T.render();
    const setCap = v => { $("capital").value = v; $("capital").dispatchEvent(new Event("input")); };
    setCap(25000);
    ok(!$("capHint").hidden, "hint hidden for 25000");
    const al = T.allocate(25000), lastStep = T.ladder(al[2])[2];
    ok($("capFrac").textContent === "端数" + yen(6800) + "が本隊3段目に入ります（本隊3段目 " + yen(lastStep) + "）", "capFrac: " + $("capFrac").textContent);
    ok($("capLow").textContent === yen(18200) && $("capUp").textContent === yen(27300), "buttons: " + $("capLow").textContent + " " + $("capUp").textContent);
    L.push("25000 hint: " + $("capHint").innerText.replace(/\s+/g, " "));
    $("capLow").click();
    ok($("capital").value === "18200" && $("capHint").hidden, "click low -> " + $("capital").value);
    ok(T.state.capital === 100000, "clicking a suggestion must not start");
    setCap(27350); ok(!$("capHint").hidden && $("capHint").innerText.indexOf("27,300") < 0 || true, "");
    setCap(27350); ok($("capHint").hidden, "27350 floors to 27300 (clean) -> hint hidden");
    setCap(5000); ok(!$("capHint").hidden && $("capLowWrap").hidden && !$("capUpWrap").hidden && $("capUp").textContent === yen(MIN_CAPITAL), "below min: only up");
    L.push("5000 hint: " + $("capHint").innerText.replace(/\s+/g, " "));
    setCap(91000); ok($("capHint").hidden, "91000 clean -> hidden");
    setCap(""); ok($("capHint").hidden, "empty -> hidden");

    // ---- 5. 合成オッズ計算の判定 ----
    T.state = T.newState(100000, 110); T.render();
    L.push("calc judge: " + $("calcJudge").textContent);
    ok(/OK|不足/.test($("calcJudge").textContent), "calc judge missing");
    // 2段目まで外す → 必要払戻が大きくなる
    T.apply(T.currentBet(), false, 0, {date: "2026-11-06", venue: "24_大村", race: 1}); T.render();
    L.push("after miss: " + $("needOdds").textContent + " / " + $("calcJudge").textContent);
    const steps = [...document.querySelectorAll("#armies .army")[0].querySelectorAll(".step")].map(e => e.innerText.replace(/\s+/g, " "));
    L.push("歩兵 steps: " + steps.join(" | "));
  } catch (e){ fails.push("EXCEPTION " + e + "\n" + (e.stack || "")); }
  report();
})();
</script>
